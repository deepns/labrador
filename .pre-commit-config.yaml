# Install once: uv run --extra dev pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
  - repo: local
    hooks:
      - id: no-local-paths
        name: no machine-specific paths
        entry: scripts/check_local_paths.sh
        language: script
        exclude: ^(uv\.lock|CLAUDE\.md|scripts/check_local_paths\.sh)$
