<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labrador</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="row">
    <h1>labrador</h1>
    <input id="q" type="search" placeholder="Describe what you're looking for…" autofocus autocomplete="off">
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-only="" aria-pressed="true">All</button>
    <button class="chip" data-only="visual" aria-pressed="false">Pictures &amp; pages</button>
    <button class="chip" data-only="text" aria-pressed="false">Documents</button>
    <button class="chip" data-only="pdf" aria-pressed="false">PDFs</button>
    <button class="chip" data-only="image" aria-pressed="false">Images</button>
    <span class="stat" id="stat"></span>
  </div>
</header>
<main><div id="results" class="grid"></div><div id="empty" class="empty">Type a description: “a dog on the beach”, “the clause about late fees”, “bar chart of quarterly revenue”.</div></main>
<dialog id="lb"><img id="lbimg" alt=""></dialog>
<script src="/static/app.js" defer></script>
</body>
</html>
