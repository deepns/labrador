[project]
name = "labrador"
version = "0.1.0"
description = "Local multimodal semantic search over a folder (text, PDF, images) with EmbeddingGemma 2"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "sentence-transformers>=6.1.0",   # first release with EmbeddingGemma 2 support
    "transformers",
    "torch>=2.5",                     # MPS backend on Apple Silicon
    "torchvision",                    # EmbeddingGemma 2's processor needs it to load
    "pillow>=10",
    "numpy>=1.26",
    "pypdfium2>=4.30",                # PDFium: PDF text, page renders, embedded images (Apache/BSD)
    "starlette>=0.37",
    "uvicorn>=0.29",
    "watchdog>=4",
    "tqdm",
]

[project.optional-dependencies]
mac = [
    "ocrmac>=1.0",          # Apple Vision OCR (fast, accurate, on-device)
    "pillow-heif>=0.16",    # iPhone HEIC photos
]
docs = ["python-docx>=1.1"]
tesseract = ["pytesseract>=0.3"]   # OCR fallback on non-Mac machines (needs `brew install tesseract`)
sample = ["reportlab>=4", "matplotlib>=3.8"]   # only for the sample and benchmark generators
dev = ["pytest>=8", "httpx", "reportlab>=4", "ruff>=0.17"]

[project.scripts]
labrador = "labrador.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labrador"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Lint only; the compact one-liner style is deliberate, so no formatter and no E7 (semicolons).
select = ["E4", "E9", "F", "I", "B", "UP"]
ignore = ["B905"]   # zip(strict=) everywhere is noise for a learning codebase

[tool.ruff.lint.per-file-ignores]
"evals/deep/*" = ["E402", "B007", "UP031"]   # one-off analysis scripts
"evals/deep/harness3.py" = ["F821"]           # exec()s harness2.py's source for its names
